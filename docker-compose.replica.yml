version: '3.8'

services:
  app:
    build: ./app
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db-master
      - db-slave1
    environment:
      - DB_MASTER_HOST=db-master
      - DB_SLAVE_HOST=db-slave1

  # MASTER DATABASE (Escritura)
  db-master:
    image: mysql:8.0
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-do-db=appdb
      --max-connections=200
      --innodb-buffer-pool-size=256M
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-appdb}
      - MYSQL_USER=${MYSQL_USER:-appuser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-app123}
      - MYSQL_REPLICATION_USER=replica_user
      - MYSQL_REPLICATION_PASSWORD=replica_pass
      - TZ=${TZ:-America/Bogota}
    ports:
      - "3306:3306"
    volumes:
      - db_master_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d
      - ./database/mysql-master.cnf:/etc/mysql/conf.d/master.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db_network

  # SLAVE DATABASE 1 (Solo lectura)
  db-slave1:
    image: mysql:8.0
    command: >
      --server-id=2
      --relay-log=mysql-relay-bin
      --log-bin=mysql-bin
      --binlog-format=ROW
      --read-only=1
      --max-connections=100
      --innodb-buffer-pool-size=128M
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-appdb}
      - MYSQL_USER=${MYSQL_USER:-appuser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-app123}
      - TZ=${TZ:-America/Bogota}
    ports:
      - "3307:3306"
    volumes:
      - db_slave1_data:/var/lib/mysql
      - ./database/mysql-slave.cnf:/etc/mysql/conf.d/slave.cnf
    depends_on:
      db-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db_network

  # SLAVE DATABASE 2 (Solo lectura para backups)
  db-slave2:
    image: mysql:8.0
    command: >
      --server-id=3
      --relay-log=mysql-relay-bin
      --log-bin=mysql-bin
      --binlog-format=ROW
      --read-only=1
      --max-connections=50
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-appdb}
      - MYSQL_USER=${MYSQL_USER:-appuser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-app123}
      - TZ=${TZ:-America/Bogota}
    ports:
      - "3308:3306"
    volumes:
      - db_slave2_data:/var/lib/mysql
      - ./database/mysql-slave.cnf:/etc/mysql/conf.d/slave.cnf
    depends_on:
      db-master:
        condition: service_healthy
    networks:
      - db_network

  # MONITOR DE REPLICACIÓN
  db-monitor:
    image: prom/mysqld-exporter
    environment:
      - DATA_SOURCE_NAME=root:${MYSQL_ROOT_PASSWORD:-root123}@(db-master:3306)/
    ports:
      - "9104:9104"
    depends_on:
      - db-master
    networks:
      - db_network

volumes:
  db_master_data:
  db_slave1_data:
  db_slave2_data:

networks:
  db_network:
    driver: bridge