version: '3.8'

services:
  # Contenedor de aplicación principal
  app:
    build: ./app
    container_name: bootcamp-app
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - ./shared:/var/www/shared
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bootcamp-network
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXP_HOURS=${JWT_EXP_HOURS}
      - DB_HOST=db
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}

  # Contenedor de base de datos
  db:
    image: mysql:8.0
    container_name: bootcamp-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - TZ=${TZ}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - bootcamp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  # Contenedor de autenticación (JWT)
  auth:
    build: ./auth
    container_name: bootcamp-auth
    ports:
      - "8082:80"
    volumes:
      - ./auth:/var/www/html
      - ./shared:/var/www/shared
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bootcamp-network
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXP_HOURS=${JWT_EXP_HOURS}
      - AUTH_URL=${AUTH_URL}
      - APP_URL=${APP_URL}
      - DB_HOST=db
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}

  # Phpmyadmin (opcional, para gestionar BD)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bootcamp-phpmyadmin
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=${MYSQL_USER}
      - PMA_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      - db
    networks:
      - bootcamp-network

networks:
  bootcamp-network:
    driver: bridge

volumes:
  db_data: